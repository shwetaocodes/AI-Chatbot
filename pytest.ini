[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
filterwarnings =
    ignore::DeprecationWarning

markers =
    llm: marks tests that require a running LLM (skip in CI)

[coverage:run]
omit =
    alembic/*
    tests/*
    htmlcov/*