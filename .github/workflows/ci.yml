# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:

  DATABASE_URL: postgresql+asyncpg://chatbot_db:password@localhost:5432/chatbot_db
  SYNC_DATABASE_URL: postgresql+psycopg2://chatbot_db:password@localhost:5432/chatbot_db
  TEST_DATABASE_URL: postgresql+asyncpg://chatbot_db:password@localhost:5432/chatbot_db_test
  TEST_SYNC_DATABASE_URL: postgresql+psycopg2://chatbot_db:password@localhost:5432/chatbot_db_test
  REDIS_URL: redis://localhost:6379
  SECRET_KEY: ci-secret-key-not-used-in-production-min-32-chars
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  REFRESH_TOKEN_EXPIRE_DAYS: 7

jobs:

  # ── Job 1: Lint ──────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Job 2: Test ──────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint    # only runs if lint passes

    services:
      # PostgreSQL service container
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatbot_db
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chatbot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service container
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=password psql \
            -h localhost \
            -U chatbot_db \
            -d chatbot_db \
            -c "CREATE DATABASE chatbot_db_test;"

      - name: Run migrations on test DB
        run: |
          DATABASE_URL=$TEST_DATABASE_URL \
          SYNC_DATABASE_URL=$TEST_SYNC_DATABASE_URL \
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()    # upload even if tests fail
        with:
          name: coverage-report
          path: htmlcov/

  # ── Job 3: Build ─────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test    # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t chatbot-api:${{ github.sha }} \
            -t chatbot-api:latest \
            .

      - name: Verify image runs
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e SYNC_DATABASE_URL=postgresql+psycopg2://x:x@localhost/x \
            -e REDIS_URL=redis://localhost \
            -e SECRET_KEY=test-secret-key-for-ci-minimum-32-chars \
            chatbot-api:latest \
            python -c "from main import app; print('Image OK')"