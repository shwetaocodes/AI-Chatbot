services:
  chatbot_db:
    image: postgres:16
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_USER: chatbot_db
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: chatbot_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      chatbot_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app  
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data: